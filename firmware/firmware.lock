# firmware/firmware.lock — linux-firmware files fetched at build time.
#
# scripts/fetch-firmware.sh downloads every "file" entry from linux-firmware
# at the pinned commit into build/firmware/ (amdgpu/ images under
# build/firmware/amdgpu/, with WHENCE and LICENSE.amdgpu copied next to them)
# and checks each SHA-256 and size. The files are distributed under their own
# licenses (see WHENCE and LICENSE.amdgpu); they are not part of this
# repository.
#
# The default set is what the AMD Radeon AI PRO R9700 (GFX12, PSP 14, SMU 14,
# SDMA 7, VCN 5) path loads today, plus its DCN 4.0.1 display microcontroller
# (DMCUB) image, which amdgpu_dm requests only when display is enabled. Add
# files for other GPUs with
#   scripts/fetch-firmware.sh --add amdgpu/<name>.bin ...
# which records them here, or fetch the whole amdgpu/ directory at the same
# commit with
#   scripts/fetch-firmware.sh --all
# To move to a newer linux-firmware release, change "tag" and "commit" and run
#   scripts/fetch-firmware.sh --relock

